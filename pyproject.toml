[project]
name = "telegram-ai-coder-bot"
version = "0.1.0"
description = "Telegram-бот — аналог opencode/Cursor с поддержкой множества LLM-провайдеров"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
